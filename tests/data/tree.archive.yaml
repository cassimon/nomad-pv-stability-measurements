        sub_instructions:
        - m_def: nomad_pv_stability_measurements.schema_packages.general.RepeatingBlock
          name: B
        - m_def: nomad_pv_stability_measurements.schema_packages.general.RepeatingBlock
          name: C
      - m_def: nomad_pv_stability_measurements.schema_packages.general.RepeatingBlock
        name: D
