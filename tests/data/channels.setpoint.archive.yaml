data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: steady soak
  instructions:
  - m_def: nomad_pv_stability_measurements.schema_packages.hold_instructions.HoldTemperature
    monitor: true
    sample_every: 60.0
    setpoint: 338.15
    control: true
  - m_def: nomad_pv_stability_measurements.schema_packages.hold_instructions.HoldIrradiance
    spectrum: AM1.5G
    monitor: true
    sample_every: 60.0
    setpoint: 1000.0
    control: true
  - m_def: nomad_pv_stability_measurements.schema_packages.hold_instructions.HoldVoltage
    monitor: true
    sampling_rate: 1.0
  - m_def: nomad_pv_stability_measurements.schema_packages.hold_instructions.HoldCurrent
    monitor: true
    sampling_rate: 1.0
  - m_def: nomad_pv_stability_measurements.schema_packages.hold_instructions.HoldResistance
    monitor: true
    sampling_rate: 1.0
  - m_def: nomad_pv_stability_measurements.schema_packages.general.CountingRepeatingBlock
    name: soak
    repeat_n: 1
    sub_instructions:
    - m_def: nomad_pv_stability_measurements.schema_packages.hold_instructions.HoldTemperature
      duration: 1800000.0
      sampling_rate: 10.0
      setpoint: 358.15
      control: true
    - m_def: nomad_pv_stability_measurements.schema_packages.hold_instructions.HoldTemperature
      duration: 360000.0
    - m_def: nomad_pv_stability_measurements.schema_packages.hold_instructions.HoldIrradiance
      duration: 360000.0
      setpoint: 0.0
      control: true
    - m_def: nomad_pv_stability_measurements.schema_packages.hold_instructions.HoldVoltage
      duration: 86400.0
      setpoint: 0.8
      control: true
    - m_def: nomad_pv_stability_measurements.schema_packages.mpp_instructions.VOCTracking
      duration: 3600.0
      control: true
