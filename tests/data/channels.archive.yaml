data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: steady soak
  steps:
  - m_def: nomad_pv_stability_measurements.schema_packages.steps.TemperatureStep
    monitor: true
    sample_every: 60.0
    setpoint: 338.15
    control: true
  - m_def: nomad_pv_stability_measurements.schema_packages.steps.IrradianceStep
    spectrum: AM1.5G
    monitor: true
    sample_every: 60.0
    setpoint: 1000.0
    control: true
  - m_def: nomad_pv_stability_measurements.schema_packages.steps.VoltageStep
    monitor: true
    sampling_rate: 1.0
  - m_def: nomad_pv_stability_measurements.schema_packages.steps.CurrentStep
    monitor: true
    sampling_rate: 1.0
  - m_def: nomad_pv_stability_measurements.schema_packages.steps.ResistanceStep
    monitor: true
    sampling_rate: 1.0
  - m_def: nomad_pv_stability_measurements.schema_packages.routine.PlannedSubroutineStep
    name: soak
    steps:
    - m_def: nomad_pv_stability_measurements.schema_packages.steps.TemperatureStep
      estimated_duration: 1800000.0
      sampling_rate: 10.0
      setpoint: 358.15
      control: true
    - m_def: nomad_pv_stability_measurements.schema_packages.steps.TemperatureStep
      estimated_duration: 360000.0
    - m_def: nomad_pv_stability_measurements.schema_packages.steps.IrradianceStep
      estimated_duration: 360000.0
      setpoint: 0.0
      control: true
    - m_def: nomad_pv_stability_measurements.schema_packages.steps.VoltageStep
      estimated_duration: 86400.0
      setpoint: 0.8
      control: true
