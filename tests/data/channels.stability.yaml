data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: steady soak
  channel_settings:
    temperature:
      specify: 65 °C
      control: true
      monitor: true
      sample_every: 60 s
    irradiation:
      specify: 1 sun
      control: true
      light_source: {type: solar simulator, spectrum: AM1.5G}
      monitor: true
      sample_every: 60 s
    electrical_load:
      monitor: true
      sampling_rate: 1 Hz
  routine:
    name: soak
    repeat: 1
    instructions:
      - channel: temperature        # an episode: 500 h at 85 °C, logged fast
        specify: 85 °C
        control: true
        duration: 500 h
        sampling_rate: 10 Hz
      - channel: temperature        # nothing stated: left to drift for 100 h
        duration: 100 h
      - channel: irradiation        # deliberately dark: stated, and regulated by nothing
        specify: dark
        duration: 100 h
      - channel: electrical_load    # §8's form: the variable named beside the value
        variable: voltage
        specify: 0.8 V
        control: true
        duration: 24 h
      - channel: electrical_load    # a disconnected cell: stated, and regulated by nothing
        specify: open_circuit
        duration: 1 h
