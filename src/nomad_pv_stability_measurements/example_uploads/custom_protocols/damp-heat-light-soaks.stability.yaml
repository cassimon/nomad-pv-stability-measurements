data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: Damp heat with light soaks
  environment: indoor
  notes: >-
    Damp heat interrupted by light soaks, not a standard: 85 °C and 85 % throughout,
    and four times a day in the dark followed by a light soak at the maximum power
    point. The cell is tracked only while lit, and left at open circuit in the dark.
    Shows an instruction held only within one phase of a repetition.
  channel_settings:
    temperature: {hold: 85 °C, control: true, monitor: true}
    atmosphere:
      - {variable: relative_humidity, hold: 85 %, control: true, monitor: true}
      - {variable: oxygen, reference_point: ambient air}
  routine:
    name: dark and light
    repeat: 4
    instructions:
      - name: dark
        repeat: 1
        mode: parallel
        instructions:
          - {channel: irradiation, hold: dark, duration: 20 h}
          - {channel: electrical_load, hold: open_circuit, duration: whole block}
      - name: light soak
        repeat: 1
        mode: parallel
        instructions:
          - {channel: irradiation, hold: 1000 W/m^2, control: true, monitor: true, duration: 4 h}
          - {channel: electrical_load, hold: mpp, monitor: true, duration: whole block}
