data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-T-2 (65 °C)
  standard: ISOS-T-2
  standard_variant: 65 °C
  environment: indoor
  notes: Thermal cycling in an oven or environmental chamber.
  channel_settings:
    irradiation:
      hold: dark
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      hold: open_circuit
  routine:
    commands:
      - channel: temperature
        ramp:
          from: RT
          to: 65 °C
        end_of_ramp_behavior: cycle
