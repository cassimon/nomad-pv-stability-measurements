data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-V-1 (V_MPP)
  standard: ISOS-V-1
  standard_variant: V_MPP
  environment: indoor
  notes: In ambient air. Positive bias at V_MPP, from a light J–V curve of the fresh device; below E_g/q.
  channel_settings:
    irradiation:
      hold: dark
    temperature:
      hold: RT
      control: false
      monitor: true
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      variable: voltage
      control: true
      reference_point: V_MPP
