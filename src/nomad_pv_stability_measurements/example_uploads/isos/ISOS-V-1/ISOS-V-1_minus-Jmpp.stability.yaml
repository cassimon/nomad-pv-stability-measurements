  name: ISOS-V-1 (−J_MPP)
  standard: ISOS-V-1
  standard_variant: −J_MPP
  environment: indoor
  notes: In ambient air. Negative bias at −J_MPP, from a light J–V curve of the fresh device.
  channel_settings:
    irradiation:
      hold: dark
    temperature:
      hold: RT
      control: false
      monitor: true
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      variable: current
      control: true
      reference_point: -J_MPP
