data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-LT-1 (linear ramping, fixed voltage near MPP, recommended 800–1000 W/m²)
  standard: ISOS-LT-1
  standard_variant: linear ramping, fixed voltage near MPP, recommended 800–1000 W/m²
  environment: indoor
  notes: Solar-thermal cycling in a weathering chamber. Fixed voltage bias near the MPP.
  channel_settings:
    irradiation:
      hold_between:
        lower: 800 W/m^2
        upper: 1000 W/m^2
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      variable: voltage
      control: true
      reference_point: near V_MPP
  routine:
    commands:
      - channel: temperature
        ramp:
          from: RT
          to: 65 °C
        end_of_ramp_behavior: triangle
