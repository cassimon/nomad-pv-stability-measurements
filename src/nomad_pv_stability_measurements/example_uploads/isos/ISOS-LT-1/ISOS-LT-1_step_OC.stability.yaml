data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-LT-1 (step ramping, OC)
  standard: ISOS-LT-1
  standard_variant: step ramping, OC
  environment: indoor
  notes: Solar-thermal cycling in a weathering chamber.
  channel_settings:
    irradiation:
      control: true
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      hold: open_circuit
  routine:
    commands:
      - channel: temperature
        ramp:
          from: RT
          to: 65 °C
        end_of_ramp_behavior: cycle
