data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-LT-1 (step ramping, MPP, recommended 800–1000 W/m²)
  standard: ISOS-LT-1
  standard_variant: step ramping, MPP, recommended 800–1000 W/m²
  environment: indoor
  notes: Solar-thermal cycling in a weathering chamber.
  channel_settings:
    irradiation:
      hold_between:
        lower: 800 W/m^2
        upper: 1000 W/m^2
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      hold: mpp
  routine:
    commands:
      - channel: temperature
        ramp:
          from: RT
          to: 65 °C
        end_of_ramp_behavior: cycle
