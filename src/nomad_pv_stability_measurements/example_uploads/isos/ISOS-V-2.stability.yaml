data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-V-2
  standard: ISOS-V-2
  environment: indoor
  notes: In an oven in ambient air. Bias from a light J–V curve of the fresh device; a positive voltage stays below E_g/q.
  channel_settings:
    irradiation:
      hold: dark
    temperature:
      monitor: true
      options:
        - hold: 65 °C
        - hold: 85 °C
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      control: true
      options:
        - {label: V_MPP, variable: voltage, reference_point: V_MPP}
        - {label: V_oc, variable: voltage, reference_point: V_oc}
        - {label: J_SC, variable: current, reference_point: J_SC}
        - {label: −V_oc, variable: voltage, reference_point: -V_oc}
        - {label: −J_MPP, variable: current, reference_point: -J_MPP}
  instructions:
    # Ambient air: only the protocols marked "I" run in an inert atmosphere (p.42).
    - {channel: atmosphere, variable: oxygen, reference_point: ambient air}
