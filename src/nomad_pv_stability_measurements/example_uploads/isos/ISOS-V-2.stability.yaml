data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-V-2
  standard: ISOS-V-2
  environment: indoor
  notes: In an oven in ambient air. Bias from a light J–V curve of the fresh device; a positive voltage stays below E_g/q.
  channel_settings:
    irradiation: {specify: dark}
    temperature:
      control: true
      options:
        - specify: 65 °C
        - specify: 85 °C
    atmosphere:
      - {variable: relative_humidity, monitor: true}
      # Ambient air: only the protocols marked "I" run in an inert atmosphere (p.42).
      - {variable: oxygen, specify: ambient}
    electrical_load:
      control: true
      options:
        - {label: V_MPP, variable: voltage, specify: V_MPP}
        - {label: V_oc, variable: voltage, specify: V_oc}
        - {label: J_SC, variable: current, specify: J_SC}
        - {label: −V_oc, variable: voltage, specify: -V_oc}
        - {label: −J_MPP, variable: current, specify: -J_MPP}
