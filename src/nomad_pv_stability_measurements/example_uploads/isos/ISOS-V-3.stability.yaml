data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-V-3
  standard: ISOS-V-3
  environment: indoor
  notes: In an environmental chamber. Bias from a light J–V curve of the fresh device; a positive voltage stays below E_g/q.
  channel_settings:
    irradiation:
      hold: dark
    temperature:
      monitor: true
      options:
        - hold: 65 °C
        - hold: 85 °C
    atmosphere:
      relative_humidity: 85 %
      monitor: true
    electrical_load:
      control: true
      options:
        - {label: V_MPP, variable: voltage, reference_point: V_MPP}
        - {label: V_oc, variable: voltage, reference_point: V_oc}
        - {label: J_SC, variable: current, reference_point: J_SC}
        - {label: −V_oc, variable: voltage, reference_point: -V_oc}
        - {label: −J_MPP, variable: current, reference_point: -J_MPP}
