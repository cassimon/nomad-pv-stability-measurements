data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-L-3
  standard: ISOS-L-3
  environment: indoor
  notes: Light soaking under a solar simulator. Relative humidity about 50 %.
  channel_settings:
    irradiation:
      # "Ideally, light sources with an irradiance of 800–1000 W m–² … should be applied" (p.43)
      specify: {lower: 800 W/m^2, upper: 1000 W/m^2}
      control: true
    temperature:
      control: true
      options:
        - specify: 65 °C
        - specify: 85 °C
    atmosphere:
      - {variable: relative_humidity, specify: 50 %, control: true}
      # Ambient air: only the protocols marked "I" run in an inert atmosphere (p.42).
      - {variable: oxygen, specify: ambient}
    electrical_load: {specify: mpp, control: true, monitor: true}
