data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-T-1 (85 °C)
  standard: ISOS-T-1
  standard_variant: 85 °C
  environment: indoor
  notes: Thermal cycling on a hot plate or in an oven.
  channel_settings:
    irradiation:
      hold: dark
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      hold: open_circuit
  routine:
    commands:
      - channel: temperature
        ramp:
          from: RT
          to: 85 °C
        end_of_ramp_behavior: cycle
