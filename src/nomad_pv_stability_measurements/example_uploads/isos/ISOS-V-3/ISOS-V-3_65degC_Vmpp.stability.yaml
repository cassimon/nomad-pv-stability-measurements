data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-V-3 (65 °C, V_MPP)
  standard: ISOS-V-3
  standard_variant: 65 °C, V_MPP
  environment: indoor
  notes: In an environmental chamber. Positive bias at V_MPP, from a light J–V curve of the fresh device; below E_g/q.
