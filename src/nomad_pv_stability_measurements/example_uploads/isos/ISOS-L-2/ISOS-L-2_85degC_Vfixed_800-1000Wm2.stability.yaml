data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-L-2 (85 °C, fixed voltage near MPP, recommended 800–1000 W/m²)
  standard: ISOS-L-2
  standard_variant: 85 °C, fixed voltage near MPP, recommended 800–1000 W/m²
  environment: indoor
  notes: Light soaking under a solar simulator, at elevated temperature. Fixed voltage bias near the MPP.
  channel_settings:
    irradiation:
      hold_between:
        lower: 800 W/m^2
        upper: 1000 W/m^2
    temperature:
      hold: 85 °C
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      variable: voltage
      control: true
      reference_point: near V_MPP
