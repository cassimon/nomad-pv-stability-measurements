data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-L-2 (65 °C, MPP, recommended 800–1000 W/m²)
  standard: ISOS-L-2
  standard_variant: 65 °C, MPP, recommended 800–1000 W/m²
  environment: indoor
  notes: Light soaking under a solar simulator, at elevated temperature.
  channel_settings:
    irradiation:
      hold_between:
        lower: 800 W/m^2
        upper: 1000 W/m^2
    temperature:
      hold: 65 °C
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      hold: mpp
