data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-L-2 (85 °C, fixed voltage near MPP)
  standard: ISOS-L-2
  standard_variant: 85 °C, fixed voltage near MPP
  environment: indoor
  notes: Light soaking under a solar simulator, at elevated temperature. Fixed voltage bias near the MPP.
  channel_settings:
    irradiation:
      control: true
    temperature:
      hold: 85 °C
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      variable: voltage
      control: true
      reference_point: near V_MPP
