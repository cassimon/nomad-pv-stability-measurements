data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-LC-1 (8 h, 1:2, OC)
  standard: ISOS-LC-1
  standard_variant: 8 h, 1:2, OC
  environment: indoor
  notes: Light–dark cycling under a solar simulator.
  channel_settings:
    temperature:
      hold: RT
      control: false
      monitor: true
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      hold: open_circuit
  routine:
    repeat: until_end_of_protocol
    commands:
      - channel: irradiation
        control: true
        duration: 160 min
      - channel: irradiation
        hold: dark
        duration: 320 min
