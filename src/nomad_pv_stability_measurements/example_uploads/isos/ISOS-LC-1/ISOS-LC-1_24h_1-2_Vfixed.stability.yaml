data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-LC-1 (24 h, 1:2, fixed voltage near MPP)
  standard: ISOS-LC-1
  standard_variant: 24 h, 1:2, fixed voltage near MPP
  environment: indoor
  notes: Light–dark cycling under a solar simulator. Fixed voltage bias near the MPP.
  channel_settings:
    temperature:
      hold: RT
      control: false
      monitor: true
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      variable: voltage
      control: true
      reference_point: near V_MPP
  routine:
    repeat: indefinitely
    commands:
      - channel: irradiation
        control: true
        duration: 8 h
      - channel: irradiation
        hold: dark
        duration: 16 h
