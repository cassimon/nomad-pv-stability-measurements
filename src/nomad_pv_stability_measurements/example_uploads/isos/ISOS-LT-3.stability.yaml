data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-LT-3
  standard: ISOS-LT-3
  environment: indoor
  notes: Solar-thermal cycling in a chamber with freezing; RH controlled at 50 % above 40 °C.
  channel_settings:
    irradiation:
      control: true
      monitor: true
      # "Ideally, light sources with an irradiance of 800–1000 W m–² … should be applied" (p.43)
      hold_between: {lower: 800 W/m^2, upper: 1000 W/m^2}
    atmosphere:
      variable: relative_humidity
      monitor: true
    electrical_load:
      hold: mpp
      monitor: true
  instructions:
    # Ambient air: only the protocols marked "I" run in an inert atmosphere (p.42).
    - {channel: atmosphere, variable: oxygen, reference_point: ambient air}
  routine:
    instructions:
      - channel: temperature
        monitor: true
        # It goes on cycling until the test is stopped.
        duration: open-ended
        ramp:
          from: -25 °C
          to: 65 °C
        end_of_ramp_behavior: triangle
