data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-T-2
  standard: ISOS-T-2
  environment: indoor
  notes: Thermal cycling in an oven or environmental chamber.
  channel_settings:
    irradiation:
      hold: dark
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      hold: open_circuit
  routine:
    instructions:
      - channel: temperature
        monitor: true
        ramp:
          from: RT
          options:
            - to: 65 °C
            - to: 85 °C
        end_of_ramp_behavior: cycle
