data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-LC-1
  standard: ISOS-LC-1
  environment: indoor
  notes: Light–dark cycling under a solar simulator.
  channel_settings:
    temperature:
      hold: RT
      control: false
      monitor: true
    atmosphere:
      - variable: relative_humidity
        control: false
        monitor: true
      # Ambient air: only the protocols marked "I" run in an inert atmosphere (p.42).
      - {variable: oxygen, reference_point: ambient air}
    electrical_load:
      # "options of exposure under open-circuit condition or using a fixed voltage bias near
      # the MPP (instead of active MPP tracking)" (p.37)
      options:
        - {label: MPP, hold: mpp, monitor: true}
        - {label: OC, hold: open_circuit}
        - {label: fixed voltage near MPP, variable: voltage, control: true, reference_point: near V_MPP}
  routine:
    repeat: indefinitely
    # "cycle periods of 2, 8, or 24 h and duty cycles (light:dark) of 1:1 or 1:2" (p.39)
    options:
      - label: "2 h, 1:1"
        instructions:
          - &light
            channel: irradiation
            control: true
            monitor: true
            # "Ideally, light sources with an irradiance of 800–1000 W m–² … should be applied" (p.43)
            hold_between: {lower: 800 W/m^2, upper: 1000 W/m^2}
            duration: 1 h
          - &dark {channel: irradiation, hold: dark, duration: 1 h}
      - label: "2 h, 1:2"
        instructions:
          - {<<: *light, duration: 40 min}
          - {<<: *dark, duration: 80 min}
      - label: "8 h, 1:1"
        instructions:
          - {<<: *light, duration: 4 h}
          - {<<: *dark, duration: 4 h}
      - label: "8 h, 1:2"
        instructions:
          - {<<: *light, duration: 160 min}
          - {<<: *dark, duration: 320 min}
      - label: "24 h, 1:1"
        instructions:
          - {<<: *light, duration: 12 h}
          - {<<: *dark, duration: 12 h}
      - label: "24 h, 1:2"
        instructions:
          - {<<: *light, duration: 8 h}
          - {<<: *dark, duration: 16 h}
