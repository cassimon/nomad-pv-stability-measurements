data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-O-3
  standard: ISOS-O-3
  environment: outdoor
  notes: Outdoors; in situ MPP tracking under sunlight, periodic measurements under a solar simulator.
  channel_settings:
    irradiation:
      control: false
      monitor: true
    temperature:
      control: false
      monitor: true
    atmosphere:
      - {variable: relative_humidity, control: false, monitor: true}
      # Ambient air: only the protocols marked "I" run in an inert atmosphere (p.42).
      - {variable: oxygen, reference_point: ambient air}
    electrical_load:
      hold: mpp
      monitor: true
