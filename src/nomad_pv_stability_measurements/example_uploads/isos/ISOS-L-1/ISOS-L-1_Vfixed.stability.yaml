data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-L-1 (fixed voltage near MPP)
  standard: ISOS-L-1
  standard_variant: fixed voltage near MPP
  environment: indoor
  notes: Light soaking under a solar simulator. Fixed voltage bias near the MPP.
  channel_settings:
    irradiation:
      control: true
    temperature:
      hold: RT
      control: false
      monitor: true
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      variable: voltage
      control: true
      reference_point: near V_MPP
