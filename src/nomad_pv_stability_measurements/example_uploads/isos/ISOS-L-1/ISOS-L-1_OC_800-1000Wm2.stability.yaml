data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-L-1 (OC, recommended 800–1000 W/m²)
  standard: ISOS-L-1
  standard_variant: OC, recommended 800–1000 W/m²
  environment: indoor
  notes: Light soaking under a solar simulator.
  channel_settings:
    irradiation:
      hold_between:
        lower: 800 W/m^2
        upper: 1000 W/m^2
    temperature:
      hold: RT
      control: false
      monitor: true
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      hold: open_circuit
