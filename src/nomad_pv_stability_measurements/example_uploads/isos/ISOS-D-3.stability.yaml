data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-D-3
  standard: ISOS-D-3
  environment: indoor
  notes: >-
    ISOS Table 1, row ISOS-D-3 — damp heat in an environmental chamber. The table gives
    two temperature levels, 65 degC and 85 degC, each at 85 % relative humidity; this
    file writes the lower one. The humidity is written the way the table prints it, as a
    relative humidity beside the temperature it was read at; the archive stores the
    absolute volume ratio that pair works out to, so two protocols run at different
    temperatures still compare on the number they stored. Load at open circuit. Every
    condition is constant, so this protocol has no routine. The standard fixes no test
    duration and no sampling interval, so none are written here.
  channel_settings:
    irradiation:
      hold: dark
    temperature:
      hold: 65 °C
    atmosphere:
      water_vapor:
        rh: 85 %
        at: 65 °C
    electrical_load:
      hold: open_circuit
