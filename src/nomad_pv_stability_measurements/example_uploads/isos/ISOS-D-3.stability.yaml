data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-D-3
  standard: ISOS-D-3
  environment: indoor
  notes: Damp heat, dark storage in an environmental chamber.
  channel_settings:
    irradiation:
      hold: dark
    temperature:
      monitor: true
      options:
        - hold: 65 °C
        - hold: 85 °C
    atmosphere:
      - relative_humidity: 85 %
        monitor: true
      # Ambient air: only the protocols marked "I" run in an inert atmosphere (p.42).
      - {variable: oxygen, reference_point: ambient air}
    electrical_load:
      hold: open_circuit
