data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-V-2 (85 °C, −J_MPP)
  standard: ISOS-V-2
  standard_variant: 85 °C, −J_MPP
  environment: indoor
  notes: In an oven in ambient air. Negative bias at −J_MPP, from a light J–V curve of the fresh device.
  channel_settings:
    irradiation:
      hold: dark
    temperature:
      hold: 85 °C
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      variable: current
      control: true
      reference_point: -J_MPP
