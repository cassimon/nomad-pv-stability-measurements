data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-V-2 (85 °C, V_oc)
  standard: ISOS-V-2
  standard_variant: 85 °C, V_oc
  environment: indoor
  notes: In an oven in ambient air. Positive bias at V_oc, from a light J–V curve of the fresh device; below E_g/q.
  channel_settings:
    irradiation:
      hold: dark
    temperature:
      hold: 85 °C
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      variable: voltage
      control: true
      reference_point: V_oc
