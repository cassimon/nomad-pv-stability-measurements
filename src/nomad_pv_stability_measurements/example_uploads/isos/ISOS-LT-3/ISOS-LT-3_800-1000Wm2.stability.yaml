data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-LT-3 (recommended 800–1000 W/m²)
  standard: ISOS-LT-3
  standard_variant: recommended 800–1000 W/m²
  environment: indoor
  notes: Solar-thermal cycling in a chamber with freezing; RH controlled at 50 % above 40 °C.
  channel_settings:
    irradiation:
      hold_between:
        lower: 800 W/m^2
        upper: 1000 W/m^2
    atmosphere:
      variable: relative_humidity
      monitor: true
    electrical_load:
      hold: mpp
  routine:
    commands:
      - channel: temperature
        ramp:
          from: -25 °C
          to: 65 °C
        end_of_ramp_behavior: triangle
