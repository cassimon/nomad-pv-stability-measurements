data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-LT-3
  standard: ISOS-LT-3
  environment: indoor
  notes: Solar-thermal cycling in an environmental chamber with freezing. Relative humidity controlled at 50 % above 40 °C.
  channel_settings:
    irradiation:
      control: true
    atmosphere:
      variable: water_vapor
      monitor: true
    electrical_load:
      hold: mpp
  routine:
    commands:
      - channel: temperature
        ramp:
          from: -25 °C
          to: 65 °C
        end_of_ramp_behavior: triangle
