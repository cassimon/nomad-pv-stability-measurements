data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-LT-2 (MPP, recommended 800–1000 W/m²)
  standard: ISOS-LT-2
  standard_variant: MPP, recommended 800–1000 W/m²
  environment: indoor
  notes: Solar-thermal cycling in an environmental chamber; RH controlled at 50 % above 40 °C.
  channel_settings:
    irradiation:
      hold_between:
        lower: 800 W/m^2
        upper: 1000 W/m^2
    atmosphere:
      variable: relative_humidity
      monitor: true
    electrical_load:
      hold: mpp
  routine:
    commands:
      - channel: temperature
        ramp:
          from: 5 °C
          to: 65 °C
        end_of_ramp_behavior: triangle
