data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-T-1
  standard: ISOS-T-1
  environment: indoor
  notes: Thermal cycling on a hot plate or in an oven.
  channel_settings:
    irradiation:
      hold: dark
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      hold: open_circuit
  instructions:
    # Ambient air: only the protocols marked "I" run in an inert atmosphere (p.42).
    - {channel: atmosphere, variable: oxygen, reference_point: ambient air}
  routine:
    instructions:
      - channel: temperature
        monitor: true
        # It goes on cycling until the test is stopped.
        duration: open-ended
        ramp:
          from: RT
          options:
            - to: 65 °C
            - to: 85 °C
        end_of_ramp_behavior: cycle
