data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-T-3
  standard: ISOS-T-3
  environment: indoor
  notes: Thermal cycling in an environmental chamber; RH below 55 %, controlled only above 40 °C.
  channel_settings:
    irradiation:
      hold: dark
    atmosphere:
      - variable: relative_humidity
        monitor: true
      # Ambient air: only the protocols marked "I" run in an inert atmosphere (p.42).
      - {variable: oxygen, reference_point: ambient air}
    electrical_load:
      hold: open_circuit
  routine:
    instructions:
      - channel: temperature
        monitor: true
        # It goes on cycling until the test is stopped.
        duration: open-ended
        ramp:
          from: -40 °C
          to: 85 °C
        end_of_ramp_behavior: cycle
