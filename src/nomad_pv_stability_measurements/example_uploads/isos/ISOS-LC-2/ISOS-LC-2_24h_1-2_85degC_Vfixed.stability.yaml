data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-LC-2 (24 h, 1:2, 85 °C, fixed voltage near MPP)
  standard: ISOS-LC-2
  standard_variant: 24 h, 1:2, 85 °C, fixed voltage near MPP
  environment: indoor
  notes: Light–dark cycling under a solar simulator, at elevated temperature. Fixed voltage bias near the MPP.
  channel_settings:
    temperature:
      hold: 85 °C
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      variable: voltage
      control: true
      reference_point: near V_MPP
  routine:
    repeat: until_end_of_protocol
    commands:
      - channel: irradiation
        control: true
        duration: 8 h
      - channel: irradiation
        hold: dark
        duration: 16 h
