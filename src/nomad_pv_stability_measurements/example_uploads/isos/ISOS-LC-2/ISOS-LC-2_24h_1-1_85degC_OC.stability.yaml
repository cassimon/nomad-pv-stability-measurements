data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-LC-2 (24 h, 1:1, 85 °C, OC)
  standard: ISOS-LC-2
  standard_variant: 24 h, 1:1, 85 °C, OC
  environment: indoor
  notes: Light–dark cycling under a solar simulator, at elevated temperature.
  channel_settings:
    temperature:
      hold: 85 °C
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      hold: open_circuit
  routine:
    repeat: until_end_of_protocol
    commands:
      - channel: irradiation
        control: true
        duration: 12 h
      - channel: irradiation
        hold: dark
        duration: 12 h
