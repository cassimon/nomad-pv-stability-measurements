data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-LC-2 (8 h, 1:2, 65 °C, fixed voltage near MPP, recommended 800–1000 W/m²)
  standard: ISOS-LC-2
  standard_variant: 8 h, 1:2, 65 °C, fixed voltage near MPP, recommended 800–1000 W/m²
  environment: indoor
  notes: Light–dark cycling under a solar simulator, at elevated temperature. Fixed voltage bias near the MPP.
  channel_settings:
    temperature:
      hold: 65 °C
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      variable: voltage
      control: true
      reference_point: near V_MPP
  routine:
    repeat: indefinitely
    commands:
      - channel: irradiation
        hold_between:
          lower: 800 W/m^2
          upper: 1000 W/m^2
        duration: 160 min
      - channel: irradiation
        hold: dark
        duration: 320 min
