data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-LC-2 (2 h, 1:2, 65 °C, MPP)
  standard: ISOS-LC-2
  standard_variant: 2 h, 1:2, 65 °C, MPP
  environment: indoor
  notes: Light–dark cycling under a solar simulator, at elevated temperature.
  channel_settings:
    temperature:
      hold: 65 °C
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      hold: mpp
  routine:
    repeat: until_end_of_protocol
    commands:
      - channel: irradiation
        control: true
        duration: 40 min
      - channel: irradiation
        hold: dark
        duration: 80 min
