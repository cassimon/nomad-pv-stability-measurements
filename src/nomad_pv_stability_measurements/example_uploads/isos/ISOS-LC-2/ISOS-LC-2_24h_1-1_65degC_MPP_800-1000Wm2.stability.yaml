data:
  m_def: nomad_pv_stability_measurements.schema_packages.protocol.StabilityProtocol
  name: ISOS-LC-2 (24 h, 1:1, 65 °C, MPP, recommended 800–1000 W/m²)
  standard: ISOS-LC-2
  standard_variant: 24 h, 1:1, 65 °C, MPP, recommended 800–1000 W/m²
  environment: indoor
  notes: Light–dark cycling under a solar simulator, at elevated temperature.
  channel_settings:
    temperature:
      hold: 65 °C
    atmosphere:
      variable: relative_humidity
      control: false
      monitor: true
    electrical_load:
      hold: mpp
  routine:
    repeat: until_end_of_protocol
    commands:
      - channel: irradiation
        hold_between:
          lower: 800 W/m^2
          upper: 1000 W/m^2
        duration: 12 h
      - channel: irradiation
        hold: dark
        duration: 12 h
